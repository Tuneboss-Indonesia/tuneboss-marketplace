name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PUBLIC_API_URL: https://api-marketplace.tuneboss.id/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run build

      - name: Build backend
        working-directory: backend
        run: npm ci && npm run typecheck && npm run build

      - name: Package applications
        shell: bash
        run: |
          tar -C frontend -czf frontend.tar.gz dist public app.js package.json package-lock.json
          tar -C backend -czf backend.tar.gz dist drizzle app.js drizzle.config.ts package.json package-lock.json

      - name: Start SSH agent
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$CPANEL_SSH_KEY" | ssh-add -

      - name: Add cPanel host key
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Deploy applications
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          CPANEL_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          set -euo pipefail
          remote_frontend="/home/$CPANEL_USER/.marketplace-${GITHUB_SHA}-frontend.tar.gz"
          remote_backend="/home/$CPANEL_USER/.marketplace-${GITHUB_SHA}-backend.tar.gz"

          ssh_opts=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "$CPANEL_PORT")

          ssh "${ssh_opts[@]}" "$CPANEL_USER@$CPANEL_HOST" "cat > '$remote_frontend'" < frontend.tar.gz
          ssh "${ssh_opts[@]}" "$CPANEL_USER@$CPANEL_HOST" "cat > '$remote_backend'" < backend.tar.gz

          ssh "${ssh_opts[@]}" "$CPANEL_USER@$CPANEL_HOST" \
            "bash -s -- '$remote_frontend' '$remote_backend' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          frontend="/home/$(whoami)/apps/tuneboss-marketplace/frontend"
          backend="/home/$(whoami)/apps/tuneboss-marketplace/backend"
          public_frontend="/home/$(whoami)/public_html/apps/tuneboss-marketplace/frontend"
          public_backend="/home/$(whoami)/public_html/apps/tuneboss-marketplace/backend"
          user="$(whoami)"
          front_archive=$1
          back_archive=$2
          stage="/home/$(whoami)/.marketplace-stage-$3"

          trap 'rm -rf -- "$stage"; rm -f -- "$front_archive" "$back_archive"' EXIT
          rm -rf -- "$stage"
          mkdir -p "$stage/frontend" "$stage/backend" "$frontend" "$backend"
          tar -xzf "$front_archive" -C "$stage/frontend"
          tar -xzf "$back_archive" -C "$stage/backend"
          test -f "$stage/frontend/app.js"
          test -f "$stage/backend/app.js"

          if [ ! -f "$backend/.env" ] && [ -f "$public_backend/.env" ]; then
            cp -a "$public_backend/.env" "$backend/.env"
          fi

          if [ -d "$public_frontend" ]; then
            find "$public_frontend" -mindepth 1 -maxdepth 1 ! -name .htaccess -exec rm -rf -- {} +
          fi
          if [ -d "$public_backend" ]; then
            find "$public_backend" -mindepth 1 -maxdepth 1 ! -name .htaccess -exec rm -rf -- {} +
          fi

          find "$frontend" -mindepth 1 -maxdepth 1 ! -name node_modules -exec rm -rf -- {} +
          find "$backend" -mindepth 1 -maxdepth 1 ! -name .env ! -name node_modules ! -name uploads -exec rm -rf -- {} +
          cp -a "$stage/frontend/." "$frontend/"
          cp -a "$stage/backend/." "$backend/"

          export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
          (cd "$frontend" && npm ci --omit=dev)
          if [ -f "$backend/.env" ]; then
            (cd "$backend" && npm ci --omit=dev && npm run db:migrate)
          else
            (cd "$backend" && npm ci --omit=dev)
          fi

          cloudlinux-selector set --json --interpreter nodejs --app-root apps/tuneboss-marketplace/frontend --new-app-uri / --startup-file app.js --app-mode production 2>/dev/null \
            || cloudlinux-selector create --json --interpreter nodejs --app-root apps/tuneboss-marketplace/frontend --app-uri / --startup-file app.js --app-mode production --version 22 2>/dev/null \
            || true

          cloudlinux-selector set --json --interpreter nodejs --app-root apps/tuneboss-marketplace/backend --new-app-uri / --startup-file app.js --app-mode production 2>/dev/null \
            || cloudlinux-selector create --json --interpreter nodejs --app-root apps/tuneboss-marketplace/backend --app-uri / --startup-file app.js --app-mode production --version 22 2>/dev/null \
            || true

          cloudlinux-selector restart --json --interpreter nodejs --app-root apps/tuneboss-marketplace/frontend 2>/dev/null \
            || true

          cloudlinux-selector restart --json --interpreter nodejs --app-root apps/tuneboss-marketplace/backend 2>/dev/null \
            || true

          mkdir -p "$frontend/tmp" && touch "$frontend/tmp/restart.txt"
          mkdir -p "$backend/tmp" && touch "$backend/tmp/restart.txt"
          REMOTE
